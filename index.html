.page {
  width:min(100%, 560px);
  min-height:100vh;
  margin:0 auto;
  padding:22px 18px 30px;
  background:rgba(12,12,14,.96);
}
.hero {
  width:100%;
  aspect-ratio:1.08/1;
  object-fit:cover;
  object-position:center 43%;
  border-radius:22px;
  display:block;
  box-shadow:0 18px 44px rgba(0,0,0,.32);
}
.brand { text-align:center; padding:28px 0 10px; }
.logo { width:min(290px,72%); height:auto; }
.tag {
  margin:8px 0 0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.socials {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:18px 0 20px;
}
.social {
  width:40px; height:40px; border-radius:50%;
  border:1px solid var(--line);
  display:grid; place-items:center;
  text-decoration:none; color:#fff;
  background:rgba(255,255,255,.04);
  font-size:12px; font-weight:700;
}
.social svg { width:18px; height:18px; fill:currentColor; display:block; }
.nav {
  display:flex; justify-content:center; gap:8px; margin-bottom:28px;
}
.nav a {
  color:#ddd; text-decoration:none; font-size:12px;
  padding:8px 12px; border-radius:999px;
  border:1px solid var(--line);
}
section { margin-top:28px; scroll-margin-top:14px; }
.head {
  display:flex; align-items:end; justify-content:space-between; gap:14px;
  margin-bottom:12px;
}
h2 { margin:0; font-size:21px; letter-spacing:-.02em; }
.small { color:var(--muted); font-size:11px; }
.card, .link {
  display:flex; align-items:center; gap:13px;
  padding:12px; border-radius:17px;
  text-decoration:none; color:inherit;
  background:#202024; border:1px solid rgba(255,255,255,.06);
}
.thumb {
  width:84px; height:84px; object-fit:cover; border-radius:12px;
}
.copy { flex:1; min-width:0; }
.eyebrow {
  color:var(--orange); font-weight:800; font-size:10px;
  text-transform:uppercase; letter-spacing:.13em; margin-bottom:6px;
}
.title { font-size:15px; font-weight:800; line-height:1.25; }
.meta { margin-top:5px; color:var(--muted); font-size:12px; }
.arrow { font-size:24px; color:#ddd; }
.link { margin-top:10px; padding:14px; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--orange); }
.link .grow { flex:1; }
.videos {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.video {
  position:relative; min-height:195px; overflow:hidden;
  border-radius:17px; text-decoration:none; color:#fff;
  border:1px solid rgba(255,255,255,.07);
  background:#111;
}
.video img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
}
.video::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.12) 66%);
}
.play {
  position:absolute; z-index:2; left:50%; top:45%;
  transform:translate(-50%,-50%);
  width:48px; height:48px; border-radius:50%;
